name: Apply D1 Migrations

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to remote marketplace-db"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bazaarak-d1-migrations
  cancel-in-progress: false

jobs:
  migrations:
    name: Check and optionally apply D1 migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check pending remote migrations
        run: npx --yes wrangler@4 d1 migrations list marketplace-db --remote --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply pending remote migrations
        if: ${{ inputs.apply_migrations }}
        run: npx --yes wrangler@4 d1 migrations apply marketplace-db --remote --config worker/wrangler.toml --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify remote migration status
        if: ${{ inputs.apply_migrations }}
        run: npx --yes wrangler@4 d1 migrations list marketplace-db --remote --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
